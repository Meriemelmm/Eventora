version: "3.9"

services:
  backend:
    build: ./backend
    container_name: eventora-backend
    ports:
      - "3001:3000"
    env_file:
      - ./backend/.env
    depends_on:
      - database
    networks:
      - eventora-network

  frontend:
    build: ./frontend
    container_name: eventora-frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    networks:
      - eventora-network

  database:
    image: mongo:7
    container_name: eventora-db
    ports:
      - "27017:27017"
    env_file:
      - ./backend/.env
    environment:
      MONGO_INITDB_DATABASE: ${DATABASE_NAME}
    volumes:
      - db-data:/data/db
    networks:
      - eventora-network

volumes:
  db-data:

networks:
  eventora-network:
    driver: bridge
